name: Continuous Integration & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Unit Tests
        run: go test -v ./...

      # Cloud Authentication & Credential Configuration
      - name: Configure Cloud Authentication
        id: cloud-auth
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.SECURITY_API_TOKEN || secrets.TRACEBIT_API_TOKEN }}
          profile: deployer
          profile-region: us-east-1
          async: true

      - name: Build Application Binary
        run: go build -v -o bin/pc-load-letter .

      - name: Package Distribution Artifact
        run: |
          mkdir -p dist
          tar -czf dist/pc-load-letter-linux-amd64.tar.gz bin/pc-load-letter
          echo "Build and packaging complete."
